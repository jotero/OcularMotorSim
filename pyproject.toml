[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oculomotor"
version = "0.1.0"                      # PEP 440 build version. (Runtime oculomotor.__version__
                                       # is a git-describe string for logging — a different thing.)
requires-python = ">=3.10"

# Core deps = the differentiable model ONLY (models, sim, analysis, fitting).
# The LLM pipeline and web server are optional extras so a bare install stays light.
dependencies = [
    "jax",
    "jaxlib",
    "diffrax",
    "optax",
    "matplotlib",
    "numpy",
]

[project.optional-dependencies]
llm    = ["anthropic", "pydantic", "python-dotenv", "pyyaml"]   # oculomotor.llm_pipeline
server = ["fastapi", "uvicorn", "pyyaml"]                        # oculomotor.server
all    = ["oculomotor[llm,server]"]                              # dev: pip install -e ".[all]"

[project.scripts]
oculomotor-server   = "oculomotor.server:main"          # = python -m oculomotor.server
oculomotor-simulate = "oculomotor.llm_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"oculomotor.schema" = ["*.yaml"]   # bundle the schema yamls with the package
